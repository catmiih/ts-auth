version: '3'
services:
  postgres:
    image: postgres:latest
    container_name: kitsura-postgres
    environment:
      POSTGRES_USER: kitsura
      POSTGRES_PASSWORD: run123
      POSTGRES_DB: kitsuraproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: kitsura-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: kitsura@admin.com
      PGADMIN_DEFAULT_PASSWORD: run123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
