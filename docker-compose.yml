version: '3'
services:
  postgres:
    image: postgres:latest
    container_name: kitsura-postgres
    environment:
      POSTGRES_USER: [user]
      POSTGRES_PASSWORD: [password]
      POSTGRES_DB: kitsuraproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4
    container_name: kitsura-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: [email pgadmin]
      PGADMIN_DEFAULT_PASSWORD: [password pgadmin]
    ports:
      - "5050:80"
    depends_on:
      - postgres
volumes:
  postgres_data:
